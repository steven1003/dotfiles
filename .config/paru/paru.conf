#
# $PARU_CONF
# /etc/paru.conf
# ~/.config/paru/paru.conf
#
# See the paru.conf(5) manpage for options

#
# GENERAL OPTIONS
#
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
BottomUp
BatchInstall
RemoveMake = ask
#SudoLoop
UseAsk
#SaveChanges
# CombinedUpgrade
#CleanAfter
#UpgradeMenu
NewsOnUpgrade

# LocalRepo = aur
Chroot
# Sign
# SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
[bin]
Pacman = pacman
FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas
